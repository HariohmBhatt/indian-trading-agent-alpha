name: indian-trading-agent-prod

services:
  backend:
    image: ${TRADING_AGENT_PROD_BACKEND_IMAGE:-indian-trading-agent-backend:prod}
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      target: production
      args:
        RELEASE_SHA: ${TRADING_AGENT_RELEASE_SHA:-unknown}
    env_file:
      - ${TRADING_AGENT_PROD_ENV_FILE:?Set TRADING_AGENT_PROD_ENV_FILE in the deployment environment}
    environment:
      TRADINGAGENTS_HOME: /data
      TRADING_AGENT_RELEASE_SHA: ${TRADING_AGENT_RELEASE_SHA:-unknown}
    volumes:
      - ${TRADING_AGENT_PROD_DATA_DIR:?Set TRADING_AGENT_PROD_DATA_DIR in the deployment environment}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    networks:
      - trading-prod

  frontend:
    image: ${TRADING_AGENT_PROD_FRONTEND_IMAGE:-indian-trading-agent-frontend:prod}
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      target: production
      args:
        RELEASE_SHA: ${TRADING_AGENT_RELEASE_SHA:-unknown}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TRADING_AGENT_RELEASE_SHA: ${TRADING_AGENT_RELEASE_SHA:-unknown}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    networks:
      - trading-prod

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --config /etc/cloudflared/config.yml run
    user: "0:0"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CLOUDFLARED_METRICS_PORT:-20241}:2000"
    volumes:
      - ${CLOUDFLARED_CONFIG_FILE:?Set CLOUDFLARED_CONFIG_FILE in the deployment environment}:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS_FILE:?Set CLOUDFLARED_CREDENTIALS_FILE in the deployment environment}:/etc/cloudflared/credentials.json:ro
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    networks:
      - trading-prod

networks:
  trading-prod:
    name: indian-trading-agent-prod
