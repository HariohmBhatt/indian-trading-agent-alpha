name: indian-trading-agent-prod

services:
  backend:
    image: ${TRADING_AGENT_PROD_BACKEND_IMAGE:?Set TRADING_AGENT_PROD_BACKEND_IMAGE to a digest-qualified GHCR image}
    pull_policy: always
    env_file:
      - ${TRADING_AGENT_PROD_ENV_FILE:?Set TRADING_AGENT_PROD_ENV_FILE in the deployment environment}
    environment:
      TRADINGAGENTS_HOME: /data
      TRADING_AGENT_RELEASE_SHA: ${TRADING_AGENT_RELEASE_SHA:-unknown}
    volumes:
      - ${TRADING_AGENT_PROD_DATA_DIR:?Set TRADING_AGENT_PROD_DATA_DIR in the deployment environment}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - trading-prod

  worker:
    image: ${TRADING_AGENT_PROD_BACKEND_IMAGE:?Set TRADING_AGENT_PROD_BACKEND_IMAGE to a digest-qualified GHCR image}
    pull_policy: always
    env_file:
      - ${TRADING_AGENT_PROD_ENV_FILE:?Set TRADING_AGENT_PROD_ENV_FILE in the deployment environment}
    environment:
      TRADINGAGENTS_HOME: /data
      TRADING_AGENT_RELEASE_SHA: ${TRADING_AGENT_RELEASE_SHA:-unknown}
      TRADING_AGENT_SCHEDULER_TIMEZONE: ${TRADING_AGENT_SCHEDULER_TIMEZONE:-Asia/Kolkata}
      TRADING_AGENT_SCHEDULER_POLL_SECONDS: ${TRADING_AGENT_SCHEDULER_POLL_SECONDS:-30}
      TRADING_AGENT_SCHEDULER_LEASE_SECONDS: ${TRADING_AGENT_SCHEDULER_LEASE_SECONDS:-900}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${TRADING_AGENT_PROD_DATA_DIR:?Set TRADING_AGENT_PROD_DATA_DIR in the deployment environment}:/data
    command: ["python", "-m", "backend.jobs.worker"]
    restart: unless-stopped
    networks:
      - trading-prod

  frontend:
    image: ${TRADING_AGENT_PROD_FRONTEND_IMAGE:?Set TRADING_AGENT_PROD_FRONTEND_IMAGE to a digest-qualified GHCR image}
    pull_policy: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TRADING_AGENT_RELEASE_SHA: ${TRADING_AGENT_RELEASE_SHA:-unknown}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - trading-prod

  cloudflared:
    image: cloudflare/cloudflared:2025.7.0@sha256:803b17adb5326a38ce397b9c9f374289ad290ee5526d204b5879a1423b6f5c3e
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --config /etc/cloudflared/config.yml run
    user: "0:0"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CLOUDFLARED_METRICS_PORT:-20241}:2000"
    volumes:
      - ${CLOUDFLARED_CONFIG_FILE:?Set CLOUDFLARED_CONFIG_FILE in the deployment environment}:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS_FILE:?Set CLOUDFLARED_CREDENTIALS_FILE in the deployment environment}:/etc/cloudflared/credentials.json:ro
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - trading-prod

networks:
  trading-prod:
    name: indian-trading-agent-prod
