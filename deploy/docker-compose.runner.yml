name: indian-trading-agent-runner

services:
  runner:
    build:
      context: runner
    image: indian-trading-agent-github-runner:latest
    env_file:
      - ${TRADING_AGENT_RUNNER_ENV_FILE:?Set TRADING_AGENT_RUNNER_ENV_FILE to deploy/runner.env}
    environment:
      RUNNER_NAME: ${RUNNER_NAME:-dellg15-prod-runner}
      RUNNER_LABELS: ${RUNNER_LABELS:-trading-agent-prod}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The runner only reads these files while composing the production stack.
      # Host-side bind sources (data and Cloudflare files) stay invisible here.
      - /home/hariohm/.config/indian-trading-agent/compose.env:/home/hariohm/.config/indian-trading-agent/compose.env:ro
      - /home/hariohm/.config/indian-trading-agent/prod.env:/home/hariohm/.config/indian-trading-agent/prod.env:ro
      # This file is the host-visible lock shared with manual deploy.sh runs.
      - ${TRADING_AGENT_DEPLOY_LOCK_FILE:-/home/hariohm/.config/indian-trading-agent/deploy.lock}:${TRADING_AGENT_DEPLOY_LOCK_FILE:-/home/hariohm/.config/indian-trading-agent/deploy.lock}:rw
      - indian-trading-agent-runner-config:/opt/actions-runner
      - indian-trading-agent-runner-work:/home/runner/_work
    restart: unless-stopped

volumes:
  indian-trading-agent-runner-config:
    name: indian-trading-agent-runner-config
  indian-trading-agent-runner-work:
    name: indian-trading-agent-runner-work
